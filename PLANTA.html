<style>
:root{--bg:#edf0f5;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--navy:#0f2443;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#top{background:var(--navy);color:#fff;padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#top img{height:28px;width:auto;background:#fff;border-radius:6px;padding:2px 5px}
#top h1{font-size:15px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.tb:active{background:rgba(255,255,255,.25)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 90px}
#tabs{display:flex;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#tabs button b{font-size:19px}
#tabs button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hdr{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr .n{font-weight:800;font-size:16px;line-height:1.2}.hdr .s{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.b-ok{background:var(--ok);color:#fff}.b-pri{background:var(--accent);color:#fff}.b-warn{background:#fef3c7;color:#92400e}.b-gh{background:#f1f5f9;color:var(--text)}.b-bad{background:#fee2e2;color:#991b1b}
.big{width:100%;min-height:62px;font-size:17px}
.row{display:flex;gap:10px}.row>*{flex:1}
h3{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.timer{border-left:6px solid var(--ok)}.timer.p{border-left-color:var(--warn)}
.timer .k{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
.clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:40px;font-weight:800;letter-spacing:1px;margin:4px 0 2px;line-height:1.1}
.timer.p .clock{color:var(--warn)}
.timer .w{font-weight:800;font-size:15px}.timer .d{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800}
.pill.ok{background:#dcfce7;color:#166534}.pill.p{background:#fef3c7;color:#92400e}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.who{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 10px;text-align:left;cursor:pointer;display:flex;gap:9px;align-items:center;min-height:60px}
.who:active{border-color:var(--accent)}.who .av{width:36px;height:36px;font-size:13px}.who span{font-size:13px;font-weight:700;line-height:1.2}
.who i{margin-left:auto;font-style:normal;font-size:11px;background:#dcfce7;color:#166534;border-radius:99px;padding:2px 7px;font-weight:800}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;padding:13px 12px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-size:16px;min-height:50px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.l{display:block;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 2px 5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:11px 6px;font-weight:700;font-size:13.5px;cursor:pointer;min-height:48px}
.seg button.on{border-color:var(--accent);background:#eff6ff;color:var(--accent)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.chip{border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on{border-color:var(--accent);background:#eff6ff;color:var(--accent)}
.it{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:7px;cursor:pointer;background:#fff}
.it.on{border-color:var(--accent);background:#eff6ff}.it b{font-size:13px}.it small{display:block;color:var(--muted);font-size:12px}
.sheet-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-ov.open{display:flex}
.sheet{background:#fff;width:min(560px,100%);max-height:94vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.sheet-ov{align-items:center}.sheet{border-radius:22px;max-height:90vh}}
.sheet h2{font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.x{border:0;background:#f1f5f9;border-radius:10px;width:36px;height:36px;font-size:15px;cursor:pointer}
.day{display:flex;justify-content:space-between;font-weight:800;font-size:13px;padding:10px 2px 6px}
.rec{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:13px}
.rec .h{font-family:ui-monospace,Menlo,monospace;font-weight:800;min-width:54px;text-align:right}
.rec small{display:block;color:var(--muted);font-size:11.5px}
.muted{color:var(--muted);font-size:12.5px}.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
#toast{pointer-events:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:90;max-width:92%;display:none;text-align:center}
#toast.err{background:#991b1b}
/* login */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0f2443,#1e3a8a);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
#login .box{background:#fff;border-radius:22px;width:min(420px,100%);padding:22px 18px}
#login h2{font-size:18px;text-align:center}#login p.s{text-align:center;color:var(--muted);font-size:12.5px;margin:4px 0 14px}
.pin{display:flex;justify-content:center;gap:12px;margin:14px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid #cbd5e1}.pin i.f{background:var(--accent);border-color:var(--accent)}.pin.e i{border-color:var(--danger);background:#fee2e2}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{border:0;background:#f1f5f9;border-radius:14px;min-height:58px;font-size:22px;font-weight:700;cursor:pointer}.pad button:active{background:#dbeafe}
.err{color:var(--danger);text-align:center;font-size:12.5px;min-height:18px;font-weight:600}
.who2{font-weight:800;font-size:15px;margin:6px 0 0}
#main{width:100%;max-width:760px;margin:0 auto}
.prog{height:5px;background:#e2e8f0;border-radius:9px;margin:8px 0 4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.q{font-size:19px;font-weight:800;margin:14px 2px 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--border);background:#fff;border-radius:16px;padding:16px 8px;font-weight:800;font-size:15px;cursor:pointer;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text)}.opt b{font-size:28px}
.opt.on{border-color:var(--accent);background:#eff6ff;color:var(--accent)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yn .opt{min-height:60px;padding:10px;flex-direction:row;font-size:16px}
.yn .opt.si.on{border-color:var(--ok);background:#dcfce7;color:#166534}.yn .opt.no.on{border-color:#dc2626;background:#fee2e2;color:#991b1b}
.warnbox{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:12px;padding:10px 12px;font-size:13px;color:#92400e;margin-top:10px}
.sum>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px}.sum>div:first-child{border-top:0}.sum>div>span{color:var(--muted)}.sum b{text-align:right}
.foot{display:flex;gap:10px;margin-top:18px}
.calc{background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px;padding:12px;text-align:center;font-weight:800;margin-top:12px}
.who.sel{border-color:var(--accent);background:#eff6ff}
.pic{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:#f1f5f9;flex-shrink:0;cursor:zoom-in}
.pic.big{width:min(100%,260px);height:auto;max-height:220px;object-fit:contain}
#lb{position:fixed;inset:0;background:rgba(2,6,23,.9);z-index:95;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:14px}
#lb img{max-width:100%;max-height:86vh;border-radius:12px;background:#fff}#lb span{color:#cbd5e1;font-size:12px}
</style></head>

const sb={

async function falla(r){ let m='Error '+r.status; try{ const j=await r.json(); m=j.message||j.hint||m; }catch(e){}

  let a=tmin(W.hini), b=tmin(W.hfin); if(b<=a) b+=1440; const span=b-a, d=Number(W.desc)||0;
  if(d<0||d>=span) return {err:'El descanso no es válido para ese horario'}; const min=span-d;
  if(min>960) return {err:'Más de 16 horas trabajadas: revisa las horas'};
  const fin=new Date(W.fecha+'T'+W.hini+':00'); fin.setMinutes(fin.getMinutes()+span); if(fin.getTime()>ahora()+5*60000) return {err:'La hora de fin no puede ser futura'};
  return {span,min,d}; }
function calcTxt(){ const c=calcManual(); if(c.err) return '<span style="color:var(--muted);font-weight:700">'+esc(c.err)+'</span>'; return 'Total trabajado: '+hm(c.min)+(c.d?'<div class="muted" style="font-weight:600">'+hm(c.span)+' − '+c.d+' min de descanso</div>':''); }
function actCalc(){ const e=$('w-calc'); if(e) e.innerHTML=calcTxt(); }
function calcDesde(){ if(!W.hini) return null; const n=new Date(ahora()), c=new Date(n); const p=W.hini.split(':').map(Number); c.setHours(p[0],p[1],0,0); if(c.getTime()>n.getTime()+120000) c.setDate(c.getDate()-1); return Math.max(0,Math.floor((n-c)/60000)); }
function actDesde(){ const e=$('w-calc'); if(!e) return; const m=calcDesde(); e.textContent=m==null?'Escribe la hora':(m>960?'Más de 16 horas: no es válido':'Llevas '+hm(m)); }
function itemsHtml(){ if(!W.items.length) return W.op&&W.op.length>=3&&W.buscado?'<div class="muted" style="margin-top:8px;color:var(--danger)">No encuentro la OP '+esc(W.op)+'. Revisa el número.</div>':'';
  return `<div class="muted" style="margin-top:10px"><b>${esc(W.empresa)}</b> · elige el ítem:</div>`+W.items.map(i=>`<div class="it ${i.item_num===W.item?'on':''}" onclick="elegirItem(${i.item_num})">${imgTag(i,200)}<div style="flex:1;min-width:0"><b>Ítem ${i.item_num}</b> · ${i.unidades||1} und${i.despachado?' · <span style="color:var(--warn)">ya despachado</span>':''}<small>${esc(i.descripcion||'')}</small></div></div>`).join(''); }
function buscarOp(v){ W.op=String(v).replace(/\D/g,''); W.item=null; W.items=[]; W.buscado=false; clearTimeout(_opT); const w=$('w-items'); if(W.op.length<3){ w.innerHTML=''; return; }
  w.innerHTML='<div class="muted" style="margin-top:8px">Buscando…</div>'; const mine=W.op; _opT=setTimeout(async()=>{
    try{ const r=await sb.rpc('tiempos_op',{p_op:Number(mine)}); if(W.op!==mine) return; W.items=r||[]; W.buscado=true; W.empresa=(W.items[0]&&W.items[0].empresa)||''; w.innerHTML=itemsHtml(); if(W.items.length===1) elegirItem(W.items[0].item_num); }
    catch(e){ w.innerHTML='<div class="muted" style="margin-top:8px;color:var(--danger)">'+esc(e.message)+'</div>'; } },350); }
function elegirItem(n){ W.item=n; document.querySelectorAll('#w-items .it').forEach(e=>e.classList.remove('on')); const el=[...document.querySelectorAll('#w-items .it')].find(e=>e.getAttribute('onclick')==='elegirItem('+n+')'); if(el) el.classList.add('on'); }
async function enviar(){
  if(W.busy) return; W.busy=true; const b=$('w-go'); b.disabled=true; b.textContent='Guardando…'; const trab=esTrab();
  const d={p_colaborador:W.quien,p_maquina:W.maq,p_tipo:W.tipo,p_op:trab?Number(W.op):null,p_item:trab?W.item:null,p_parada:W.tipo==='Parada de máquina'?W.par:null,
    p_nota:(W.tipo==='Mantenimiento'||W.tipo==='Parada de máquina')?limpio(W.nota)||null:null,p_turno:W.turno||null};
  const obs=trab&&(W.ver==='No'||W.ind==='No')?limpio(W.obs):null;
  try{ let r;
    if(W.m==='iniciar'){ Object.assign(d,{p_verifico:trab?W.ver:null,p_indicaciones:trab?W.ind:null,p_obs:obs,p_desde:W.ahora?null:W.hini}); r=await sb.rpc('tiempos_iniciar',d); toast('⏱️ Cronómetro iniciado'); }
    else { Object.assign(d,{p_fecha:W.fecha,p_hora_inicio:W.hini,p_hora_fin:W.hfin,p_descanso:Number(W.desc)||0,p_verifico:trab?W.ver:null,p_indicaciones:trab?W.ind:null,p_obs:obs}); r=await sb.rpc('tiempos_manual',d); toast('✅ Guardado: '+hm(r.minutos)); }
    cerrarSheet(); await refrescar(); }
  catch(e){ toast(e.message,true); b.disabled=false; b.textContent=W.m==='iniciar'?'▶ Iniciar ahora':'💾 Guardar registro'; }
  W.busy=false; }
// ── ACCIONES SOBRE UN CRONÓMETRO (pide confirmar que eres tú) ──
function pedirId(id,a){ const t=S.all.find(x=>x.id===id); if(!t) return; const v={pausar:'pausarlo',reanudar:'reanudarlo',terminar:'terminarlo'}[a]; const n=limpio(t.colaborador);
  sheet(`<h2><span>${a==='terminar'?'⏹ Terminar':a==='pausar'?'⏸ Pausar':'▶ Reanudar'}</span><button class="x" onclick="cerrarSheet()">✕</button></h2>
   <div class="card" style="margin:12px 0;background:#f8fafc;text-align:center"><div class="muted">Este cronómetro es de</div><div style="font-size:21px;font-weight:800;margin:4px 0">${esc(n)}</div><div class="muted">${esc(t.maquina)} · ${esc(detTimer(t))}</div></div>
   <p class="muted" style="text-align:center">Solo ${esc(n.split(' ')[0])} debe ${v}. Si no eres tú, cancela.</p>
   <button class="btn b-ok big" style="margin-top:12px" onclick="confirmarId('${id}','${a}')">Sí, soy ${esc(n.split(' ')[0])}</button>
   <button class="btn b-gh" style="width:100%;margin-top:10px" onclick="cerrarSheet()">No, cancelar</button>`); }
function confirmarId(id,a){ const t=S.all.find(x=>x.id===id); if(!t) return; if(a==='terminar') abrirTerminar(id); else { cerrarSheet(); accion(a,id); } }
function abrirTerminar(id){
  const t=S.all.find(x=>x.id===id); if(!t) return; const trab=t.tipo_registro==='Trabajo normal #OP'||t.tipo_registro==='Reproceso'; const s=segs(t);
  sheet(`<h2><span>⏹ Terminar</span><button class="x" onclick="cerrarSheet()">✕</button></h2>
   <div class="card" style="margin:10px 0;text-align:center;background:#f8fafc"><div class="muted">${esc(t.maquina)} · ${esc(detTimer(t))}</div><div class="clock" style="font-size:34px">${hms(s)}</div><div class="muted">${dur(s)} de trabajo${t.estado==='pausado'?' (en pausa)':''}</div></div>
   ${t.verifico==='No'||t.indicaciones==='No'?'<div class="warnbox">⚠️ Marcado al iniciar: '+esc(t.obs_inicio||'')+'</div>':''}
   <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;font-size:13px">¿Se te olvidó terminar? Corrige el tiempo</summary><label class="l">Tiempo real trabajado (minutos)</label><input type="number" inputmode="numeric" id="t-min" min="1" max="960" placeholder="${Math.max(1,Math.round(s/60))}"></details>
   <button class="btn b-ok big" id="t-go" style="margin-top:16px" onclick="terminar('${id}')">✅ Guardar registro</button>
   <button class="btn b-bad" style="width:100%;margin-top:10px" onclick="descartar('${id}')">Descartar (fue un error)</button>`);
}
async function terminar(id){
  if(S.busy) return; const mi=$('t-min')&&$('t-min').value?Number($('t-min').value):null;
  S.busy=true; const b=$('t-go'); b.disabled=true; b.textContent='Guardando…';
  try{ const r=await sb.rpc('tiempos_terminar',{p_id:id,p_minutos:mi,p_actor:(S.all.find(x=>x.id===id)||{}).colaborador}); cerrarSheet(); toast('✅ Guardado: '+Number(r.horas).toFixed(2)+' h'); await refrescar(); }
  catch(e){ toast(e.message,true); b.disabled=false; b.textContent='✅ Guardar registro'; if(/ya no existe/.test(e.message)){ cerrarSheet(); refrescar(); } }
  S.busy=false;
}
async function descartar(id){ if(!confirm('¿Descartar este cronómetro? No se guardará ningún tiempo.')) return; try{ await sb.rpc('tiempos_descartar',{p_id:id,p_actor:(S.all.find(x=>x.id===id)||{}).colaborador}); cerrarSheet(); toast('Descartado'); refrescar(); }catch(e){ toast(e.message,true); } }
// ── ARRANQUE ──
iniciar();
</script></body></html>
