const dataImg=f=>new Promise((res,rej)=>{

  if(!id)setTimeout(()=>{const a=$('f_costo_mano_obra'),b=$('f_costo_repuestos'),t=$('f_costo_total');const s=()=>{if(!t.dataset.m)t.value=(Number(a.value)||0)+(Number(b.value)||0)||'';};a.oninput=s;b.oninput=s;t.oninput=()=>t.dataset.m=1;},0);
  const pl=$('f_vehiculo_id');if(pl)pl.onchange=()=>{const v=vehById()[pl.value];};}
/* ── formulario de mantenimiento (2 pasos) ── */
let MP=[],STEP=1;
function eqList(){const dl=$('eqdl');if(!dl)return;const t=FM.tipo_equipo;dl.innerHTML=D.eq.filter(e=>!t||e.tipo===t).map(e=>`<option value="${esc(e.codigo)}">${esc([e.nombre,e.marca,e.modelo].filter(Boolean).join(' · '))}</option>`).join('');}
function eqCard(){const el=$('eqCard');if(!el)return;const e=eqByCod()[$('f_equipo_codigo').value.trim()];
  el.innerHTML=e?`<div style="display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px">${fotosEq(e,110,90)}<div style="min-width:0"><b>${esc(e.codigo)}</b><div style="font-size:12.5px;color:var(--muted)">${esc([e.nombre,e.marca,e.modelo].filter(Boolean).join(' · '))}</div>${e.ubicacion?`<div style="font-size:12px;color:var(--muted)">📍 ${esc(e.ubicacion)}</div>`:''}</div></div>`:'';}
function serAuto(e){const i=$('f_serial');if(!i||!e)return;if(!i.value||i.dataset.auto==='1'){i.value=e.serie||e.codigo||'';i.dataset.auto='1';}}
function eqPick(){const c=$('f_equipo_codigo').value.trim(),e=eqByCod()[c];eqCard();if(e){serAuto(e);if(e.tipo&&!FM.tipo_equipo){FM.tipo_equipo=e.tipo;document.querySelectorAll('#f_tipo_equipo .ch').forEach(x=>x.classList.toggle('on',x.dataset.v===e.tipo));eqList();}
  const ult=D.mant.find(m=>m.equipo_codigo===c);if(ult&&ult.estado_anterior&&!FM.estado_anterior&&false){}}}
function formMant(id,cod){const m=D.mant.find(x=>x.id===id)||{};FM={tipo_equipo:m.tipo_equipo||((eqByCod()[cod]||{}).tipo)||null,tipo_mant:m.tipo_mant||null,estado_anterior:m.estado_anterior||'BUENO',responsable_id:m.responsable_id||null,relaciona:!!m.relaciona_costos};
  MP=D.rep.filter(r=>r.mant_id===m.id).map(r=>({id:r.id,repuesto:r.repuesto||'',descripcion:r.descripcion||'',costo:Number(r.costo)||0}));STEP=1;
  const now=toLocal(new Date());const ch=(k,o,lab)=>`<div class="fg"><label>${lab}</label><div class="chs" id="f_${k}">${o.map(x=>`<button type="button" class="ch ${FM[k]===(Array.isArray(x)?x[0]:x)?'on':''}" onclick="chip('${k}',this)" data-v="${esc(Array.isArray(x)?x[0]:x)}">${esc(Array.isArray(x)?x[1]:x)}</button>`).join('')}</div></div>`;
  FOTOS=null;fotosInit('mant_mantenimientos',m.id,[{t:'falla',l:'Registro fotográfico de la falla'},{t:'trabajo',l:'Registro fotográfico del trabajo'},{t:'factura',l:'Factura'}]);
  abrir(m.id?'Editar mantenimiento':'Registrar mantenimiento',`<div class="st"><button id="s1" class="on" onclick="paso(1)">1 · Registrar</button><button id="s2" onclick="paso(2)">2 · Datos</button></div>
  <div id="p1">${ch('tipo_equipo',TIPOS_EQ,'Tipo de equipo')}
  <div class="fg"><label>Equipo / activo (código)</label><input id="f_equipo_codigo" list="eqdl" value="${esc(m.equipo_codigo||cod||'')}" onchange="eqPick()" placeholder="Escribe o elige…" autocomplete="off"><datalist id="eqdl"></datalist></div>
  <div class="fg"><label>Código / serial</label><input id="f_serial" value="${esc(m.serial||'')}" oninput="this.dataset.auto=''"></div>
  <div id="eqCard"></div>
  ${ch('tipo_mant',['PREVENTIVO','CORRECTIVO'],'Tipo de mantenimiento')}
  <div class="fg"><label>Fecha inicial *</label><input id="f_fecha_inicial" type="datetime-local" value="${toLocal(m.fecha_inicial)||now}"></div>
  <div class="fg"><label>Fecha final</label><input id="f_fecha_final" type="datetime-local" value="${toLocal(m.fecha_final)||(m.id?'':now)}"></div>
  ${ch('responsable_id',D.per.map(p=>[p.id,p.nombre]),'Responsable')}
  <div class="fg" id="g_resp_otro" style="display:none"><label>Nombre del responsable (otro) *</label><input id="f_resp_otro" placeholder="Escribe el nombre de quien hizo el trabajo" maxlength="80" value="${esc(esOtro()&&m.responsable&&!/^otro$/i.test(m.responsable.trim())?m.responsable:'')}"></div></div>
  <div id="p2" style="display:none">${ch('estado_anterior',ESTADOS,'Estado anterior')}
  <div class="fg"><label>Falla detectada / diagnóstico</label><textarea id="f_falla">${esc(m.falla||'')}</textarea></div>
  <div class="fg"><label>Actividades realizadas</label><textarea id="f_actividades">${esc(m.actividades||'')}</textarea></div>
  <div class="fg"><label>Repuestos</label><div id="reps"></div><button type="button" class="btn s" onclick="MP.push({repuesto:'',descripcion:'',costo:0});repsPaint()">＋ Agregar repuesto</button></div>
  <div class="fg"><label>¿Relacionar costos?</label><div class="chs"><button type="button" class="ch ${FM.relaciona?'':'on'}" id="rc0" onclick="relac(false)">NO</button><button type="button" class="ch ${FM.relaciona?'on':''}" id="rc1" onclick="relac(true)">SÍ</button></div></div>
  <div class="fg" id="cg" style="${FM.relaciona?'':'display:none'}"><label>Costo total</label><input id="f_costo_total" type="number" inputmode="decimal" step="any" placeholder="0" value="${Number(m.costo_total)||''}"><button type="button" class="btn s" style="margin-top:6px" onclick="sumRep()">Sumar costo de repuestos</button></div>
  <div class="fg"><label>Próximo mantenimiento</label><input id="f_proximo_mant" type="date" value="${m.proximo_mant||''}"></div>
  <div class="fg"><label>Observaciones</label><textarea id="f_observaciones">${esc(m.observaciones||'')}</textarea></div>${fotosHtml()}</div>`,
  `<button class="btn" onclick="cerrar()">Cancelar</button><button class="btn" id="bAnt" onclick="paso(1)" style="display:none">‹ Antes</button><button class="btn p" id="bSig" onclick="paso(2)">Siguiente ›</button><button class="btn p" id="btnG" onclick="guardarMant('${m.id||''}')" style="display:none">💾 Guardar</button>`);
  eqList();eqCard();repsPaint();fotosPaint();respOtro();if(!m.id){const e0=eqByCod()[(cod||'').trim()];if(e0)serAuto(e0);}}
function paso(n){STEP=n;$('p1').style.display=n===1?'':'none';$('p2').style.display=n===2?'':'none';$('s1').classList.toggle('on',n===1);$('s2').classList.toggle('on',n===2);$('bAnt').style.display=n===2?'':'none';$('bSig').style.display=n===1?'':'none';$('btnG').style.display=n===2?'':'none';$('mbody').scrollTop=0;}
function relac(v){FM.relaciona=v;$('rc0').classList.toggle('on',!v);$('rc1').classList.toggle('on',v);$('cg').style.display=v?'':'none';}
function repsPaint(){$('reps').innerHTML=MP.map((r,i)=>`<div class="rep"><input placeholder="Repuesto" value="${esc(r.repuesto)}" oninput="MP[${i}].repuesto=this.value"><input placeholder="Descripción" value="${esc(r.descripcion)}" oninput="MP[${i}].descripcion=this.value"><input placeholder="Costo" type="number" inputmode="decimal" value="${r.costo||''}" oninput="MP[${i}].costo=Number(this.value)||0"><button type="button" class="btn s d" onclick="MP.splice(${i},1);repsPaint()">✕</button></div>`).join('');}
function sumRep(){$('f_costo_total').value=MP.reduce((a,r)=>a+(Number(r.costo)||0),0)||'';}
async function guardarMant(id){const btn=$('btnG');if(btn.disabled)return;
  try{const fi=$('f_fecha_inicial').value;if(!fi){paso(1);throw new Error('Falta: Fecha inicial');}
    const cod=$('f_equipo_codigo').value.trim();if(!cod&&!FM.tipo_equipo){paso(1);throw new Error('Elige el tipo de equipo o escribe el equipo');}
    const ff=$('f_fecha_final').value;if(ff&&new Date(ff)<new Date(fi)){paso(1);throw new Error('La fecha final es anterior a la inicial');}
    const hm=v=>v?`${p2(new Date(v).getHours())}:${p2(new Date(v).getMinutes())}`:null;
    const per=perById()[FM.responsable_id];
    let respNom=per?per.nombre:null;
    if(esOtro()){const o=$('f_resp_otro').value.trim();if(!o){paso(1);$('f_resp_otro').focus();throw new Error('Escribe el nombre del responsable');}respNom=o;}
    const costo=FM.relaciona?(Number($('f_costo_total').value)||0):0;
    const data={tipo_equipo:FM.tipo_equipo||null,equipo_codigo:cod||null,serial:$('f_serial').value.trim()||null,tipo_mant:FM.tipo_mant||null,fecha_inicial:new Date(fi).toISOString(),fecha_final:ff?new Date(ff).toISOString():null,hora_inicio:hm(fi),hora_fin:hm(ff),responsable_id:FM.responsable_id||null,responsable:respNom,estado_anterior:FM.estado_anterior||null,falla:$('f_falla').value.trim()||null,actividades:$('f_actividades').value.trim()||null,relaciona_costos:!!FM.relaciona,costo_total:costo,proximo_mant:$('f_proximo_mant').value||null,observaciones:$('f_observaciones').value.trim()||null};
    btn.disabled=true;
    const r=await sb.rpc('mant_upsert',{p_tabla:'mant_mantenimientos',p_id:id||null,p_data:data});const mid=r.id;
    const orig=D.rep.filter(x=>x.mant_id===id);
    for(const o of orig){if(!MP.some(x=>x.id===o.id))await sb.rpc('mant_eliminar',{p_tabla:'mant_repuestos',p_id:o.id});}
    for(const x of MP){if(!(x.repuesto||'').trim()&&!(x.descripcion||'').trim())continue;await sb.rpc('mant_upsert',{p_tabla:'mant_repuestos',p_id:x.id||null,p_data:{mant_id:mid,repuesto:x.repuesto.trim()||null,descripcion:x.descripcion.trim()||null,costo:Number(x.costo)||0}});}
    await fotosGuardar(mid);toast('✓ Mantenimiento guardado');cerrar();await cargar();
  }catch(e){toast('⚠️ '+(e.message||e));btn.disabled=false;}}
/* ── login ── */
let USERS=[],LU=null,PIN='',busy=false;
async function cargarUsers(){try{const r=await sb.rpc('listar_usuarios');if(Array.isArray(r))USERS=r;}catch(e){}
  const ok=USERS.filter(u=>permitido(u.rol,u.roles_extra)).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  $('ug').innerHTML=ok.length?ok.map(u=>`<button class="ub" data-u="${esc(u.nombre)}" onclick="pickUser(this.dataset.u)">${esc(u.nombre)}<small>${esc(u.rol)}</small></button>`).join(''):`<div class="empty">No se pudo cargar la lista.<br><button class="more" onclick="cargarUsers()">Reintentar</button></div>`;}
function devOpen(){$('ls-user').style.display='none';$('ls-dev').style.display='block';$('dverr').textContent='';}
function devBack(){$('ls-dev').style.display='none';$('ls-user').style.display='block';}
function entrar(r,er){if(!permitido(r.rol,r.roles)){er.textContent='No tienes acceso al módulo de Mantenimiento';sb.tok=r.token;sb.rpc('logout_usuario').catch(()=>{});sb.tok=null;return false;}
  S={nombre:r.nombre,asesor:r.asesor||'',rol:r.rol,roles:(r.roles&&r.roles.length?r.roles:[r.rol]),token:r.token,ts:Date.now()};sb.tok=r.token;try{localStorage.setItem(SESS_KEY,JSON.stringify(S));}catch(e){}arrancar();return true;}
async function doLoginDev(){if(busy)return;const u=$('dvu').value.trim(),p=$('dvp').value,er=$('dverr');if(!u||!p){er.textContent='Escribe usuario y clave';return;}
  busy=true;er.textContent='Verificando…';
  try{const r=await sb.rpc('login_usuario',{p_nombre:u,p_pin:p});if(!r||!r.ok){er.textContent=(r&&r.msg)||'Usuario o clave incorrectos';return;}entrar(r,er);}catch(e){er.textContent='Sin conexión — intenta de nuevo';}finally{busy=false;}}
function pickUser(n){LU=n;PIN='';const u=USERS.find(x=>x.nombre===n)||{};$('ls-user').style.display='none';$('ls-pin').style.display='block';$('lname').textContent=n;$('lrol').textContent=u.rol||'';$('lerr').textContent='';dots();}
function pinBack(){LU=null;PIN='';$('ls-pin').style.display='none';$('ls-dev').style.display='none';$('ls-user').style.display='block';}
function dots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.className=i<PIN.length?'f':'');}
function pinP(d){if(busy||PIN.length>=4)return;PIN+=d;dots();if(PIN.length===4)setTimeout(doLogin,100);}
function pinDel(){if(busy)return;PIN=PIN.slice(0,-1);dots();}
document.addEventListener('keydown',e=>{if($('ls-pin').style.display!=='block')return;if(/^\d$/.test(e.key))pinP(e.key);else if(e.key==='Backspace')pinDel();});
async function doLogin(){if(!LU||busy)return;busy=true;const err=$('lerr');
  try{const r=await sb.rpc('login_usuario',{p_nombre:LU,p_pin:PIN});if(!r||!r.ok){err.textContent=(r&&r.msg)||'Clave incorrecta';PIN='';dots();return;}
    if(!entrar(r,err)){PIN='';dots();}}catch(e){err.textContent='Sin conexión — intenta de nuevo';PIN='';dots();}finally{busy=false;}}
async function logout(){try{await sb.rpc('logout_usuario');}catch(e){}forceLogout();}
function forceLogout(msg){S=null;sb.tok=null;try{localStorage.removeItem(SESS_KEY);}catch(e){}Object.keys(D).forEach(k=>D[k]=[]);cerrar();$('main').innerHTML='';$('tabs').innerHTML='';$('login').style.display='flex';pinBack();cargarUsers();if(msg)toast(msg);}
function arrancar(){$('login').style.display='none';const h=location.hash.slice(1);V=VISTAS.some(x=>x[0]===h)?h:'inicio';location.hash=V;render();cargar();}
(async function init(){
  if(S&&S.token){let v=true;try{v=await sb.rpc('sesion_valida');}catch(e){}
    if(v!==false&&permitido(S.rol,S.roles)){arrancar();return;}
    S=null;sb.tok=null;try{localStorage.removeItem(SESS_KEY);}catch(e){}}
  $('login').style.display='flex';cargarUsers();})();
</script>
<script id="updchk">
/* Aviso de versión nueva + recarga limpia (evita quedarse con archivos viejos en caché) */
(function(){
  function cur(){ var m=document.querySelector('meta[name="app-build"]'); return m?m.content:''; }
  window.wedmRecargaLimpia=async function(){
    try{ if(navigator.serviceWorker){ var rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function(r){ return r.unregister(); })); } }catch(e){}
    try{ if(window.caches){ var ks=await caches.keys(); await Promise.all(ks.map(function(k){ return caches.delete(k); })); } }catch(e){}
    var u=new URL(location.href); u.searchParams.set('v',String(Date.now())); location.replace(u.toString());
  };
  var shown=false, last=0;
  function mostrar(){
    if(shown||!document.body) return; shown=true;
    var b=document.createElement('div'); b.id='upd-bar';
    b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:2147483100;background:#1d4ed8;color:#fff;padding:9px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font:600 13px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.3)';
    b.innerHTML='<span>🔄 Hay una versión nueva de la aplicación.</span><button id="upd-go" style="background:#fff;color:#1d4ed8;border:0;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer">Actualizar ahora</button><button id="upd-x" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:6px 10px;cursor:pointer">Después</button>';
    document.body.appendChild(b);
    document.getElementById('upd-go').onclick=function(){ this.disabled=true; this.textContent='Actualizando…'; wedmRecargaLimpia(); };
    document.getElementById('upd-x').onclick=function(){ b.remove(); shown=false; last=Date.now()+10*60*1000; };
  }
  async function chk(){
    if(shown||!/^https?:$/.test(location.protocol)||navigator.onLine===false||Date.now()<last) return;
    last=Date.now()+60*1000;
    try{
      var r=await fetch(location.pathname+'?_chk='+Date.now(),{cache:'no-store',credentials:'omit'});
      if(!r.ok||!r.body) return;
      var rd=r.body.getReader(), dec=new TextDecoder(), t='', m=null;
      while(!m){ var x=await rd.read(); if(x.done) break; t+=dec.decode(x.value,{stream:true}); m=t.match(/<meta name="app-build" content="([^"]*)"/); if(t.length>60000) break; }
      try{ rd.cancel(); }catch(e){}
      if(m&&cur()&&m[1]!==cur()) mostrar();
    }catch(e){}
  }
  window.addEventListener('load',function(){ setTimeout(chk,6000); setInterval(chk,4*60*1000); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) chk(); });
})();
</script>
