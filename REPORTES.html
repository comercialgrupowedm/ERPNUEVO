  const rows=D.prod.filter(o=>o.despacho_fecha&&o.fecha_pactada&&inR(o.despacho_fecha)).map(o=>({o,d:difDias(o.fecha_pactada,o.despacho_fecha)})).filter(x=>x.d!=null);
  const ok=rows.filter(x=>x.d<=0),tarde=rows.filter(x=>x.d>0);
  const gm=[...group(rows,x=>mesDe(x.o.despacho_fecha))].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,a])=>[fMes(k),a.length,pct(a.filter(x=>x.d<=0).length,a.length),avg(a.filter(x=>x.d>0).map(x=>x.d))]);
  const gt=[...group(rows,x=>String(x.o.tipo||'').slice(0,2)||'(s/t)')].map(([k,a])=>[k,a.length,pct(a.filter(x=>x.d<=0).length,a.length)]).sort((a,b)=>b[1]-a[1]);
  const peor=tarde.sort((a,b)=>b.d-a.d).map(x=>[x.o.op,x.o.item_num,x.o.empresa,x.o.descripcion,x.o.fecha_pactada,x.o.despacho_fecha,x.d]);
  return kpis([['Ítems despachados',num(rows.length)],['A tiempo',fP(pct(ok.length,rows.length)),num(ok.length)+' ítems','grn'],['Tarde',fP(pct(tarde.length,rows.length)),num(tarde.length)+' ítems','red'],['Atraso promedio (tarde)',num(avg(tarde.map(x=>x.d)),1)+' d']])
   +card('% a tiempo por mes',bars(gm.map(x=>[x[0],x[2]==null?0:x[2],x[2]>=80?'var(--ok)':x[2]>=60?'var(--warn)':'var(--danger)']),v=>fP(v),100))
   +`<div class="g2">`+card('Por tipo de OP',tbl('Cumplimiento por tipo',[C('Tipo'),cN('Ítems'),cP('% a tiempo')],gt,{sort:[1,-1]}))+card('Detalle por mes',tbl('Cumplimiento por mes',[C('Mes'),cN('Ítems'),cP('% a tiempo'),cN1('Atraso prom. (d)')],gm,{}))+`</div>`
   +card('Mayores atrasos',tbl('Mayores atrasos',[C('OP'),C('Ítem'),C('Cliente'),cT('Descripción',50),cD('Pactada'),cD('Despacho'),{h:'Días tarde',f:v=>num(v),r:true}],peor,{limit:25}));});
R('p3','produccion','Horas por máquina y paradas','Registro de tiempos del rango: trabajo en OP, paradas, mantenimiento y reproceso.',['rt'],()=>{
  const rt=D.rt,trab=rt.filter(r=>/trabajo normal/i.test(r.tipo_registro||'')),par=rt.filter(r=>/parada/i.test(r.tipo_registro||''));
  const hm=[...group(trab,r=>famMaq(r.maquina))].map(([k,a])=>[k,a.length,sum(a,r=>r.duracion_horas),new Set(a.map(r=>r.op)).size]).sort((a,b)=>b[2]-a[2]);
  const det=[...group(trab,r=>String(r.maquina||'(sin máquina)').trim())].map(([k,a])=>[k,a.length,sum(a,r=>r.duracion_horas)]).sort((a,b)=>b[2]-a[2]);
  const gp=[...group(par,r=>String(r.tipo_parada||'(sin motivo)').trim().toUpperCase())].map(([k,a])=>[k,a.length,sum(a,r=>r.duracion_horas)]).sort((a,b)=>b[2]-a[2]);
  return kpis([['Horas en OP',fH(sum(trab,r=>r.duracion_horas)),num(trab.length)+' registros','grn'],['Horas de parada',fH(sum(par,r=>r.duracion_horas)),num(par.length)+' registros','amb'],['Mantenimiento',fH(sum(rt.filter(r=>/mantenimiento/i.test(r.tipo_registro||'')),r=>r.duracion_horas))],['Reproceso',fH(sum(rt.filter(r=>/reproceso/i.test(r.tipo_registro||'')),r=>r.duracion_horas)),'','red']])
   +`<div class="g2">`+card('Horas trabajadas por tipo de máquina',bars(hm.map(x=>[x[0],x[2]]),v=>num(v,1)+' h'))+card('Principales motivos de parada (horas)',bars(gp.slice(0,10).map(x=>[trunc(x[0],34),x[2],'var(--warn)']),v=>num(v,1)+' h'))+`</div>`
   +card('Detalle por máquina',tbl('Horas por máquina',[C('Máquina'),cN('Registros'),cH('Horas')],det,{sort:[2,-1],limit:30}))
   +card('Todos los motivos de parada',tbl('Paradas',[C('Motivo'),cN('Registros'),cH('Horas')],gp,{sort:[2,-1],limit:20}));});
R('p4','produccion','Horas por colaborador','Horas registradas por persona en el rango.',['rt'],()=>{
  const r=[...group(D.rt,x=>String(x.colaborador||'(sin nombre)').trim())].map(([k,a])=>{const h=f=>sum(a.filter(x=>f.test(x.tipo_registro||'')),x=>x.duracion_horas);return [k,new Set(a.map(x=>x.fecha)).size,h(/trabajo normal/i),h(/parada/i),h(/mantenimiento/i),h(/reproceso/i),sum(a,x=>x.duracion_horas)];}).sort((a,b)=>b[6]-a[6]);
  return card('Horas totales por colaborador',bars(r.slice(0,15).map(x=>[x[0],x[6]]),v=>num(v,1)+' h'))
   +card('Detalle',tbl('Horas por colaborador',[C('Colaborador'),cN('Días con registro'),cH('En OP'),cH('Paradas'),cH('Mantenimiento'),cH('Reproceso'),cH('Total')],r,{sort:[6,-1]}))
   +'<div class="note">Estas horas salen del registro de tiempos; si el colaborador escribe distinto su nombre aparecerá como filas separadas.</div>';});
R('p5','produccion','Remisiones y despachos','Remisiones despachadas en el rango, por mes y por cliente.',['rem'],()=>{
  const rows=D.rem.filter(r=>r.estado==='DESPACHADA'&&inR(r.despachada_fecha||r.fecha));
  const gm=[...group(rows,r=>mesDe(r.despachada_fecha||r.fecha))].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,a])=>[fMes(k),a.length]);
  const gc=[...group(rows,r=>r.empresa||'(sin cliente)')].map(([k,a])=>[k,a.length]).sort((a,b)=>b[1]-a[1]);
  return kpis([['Remisiones despachadas',num(rows.length),'','grn'],['Clientes atendidos',num(gc.length)],['Pendientes (generadas)',num(D.rem.filter(r=>r.estado==='GENERADA').length),'situación actual','amb']])
   +`<div class="g2">`+card('Por mes',bars(gm))+card('Por cliente',tbl('Remisiones por cliente',[C('Cliente'),cN('Remisiones')],gc,{sort:[1,-1],limit:15}))+`</div>`;});
/* PLANEACIÓN */
const MAQS=[['ingenieria','Ingeniería'],['cnc','CNC'],['torno','Torno'],['fresadora','Fresadora'],['banco','Banco'],['edm','EDM'],['rectificadora','Rectificadora'],['hilo','Hilo'],['soldadura','Soldadura']];
const entrega=o=>o.fecha_entrega_prod||o.fecha_pactada;
R('l1','planeacion','Cartera vigente y atrasos','Situación actual de los ítems en curso según su fecha de entrega de producción (o pactada).',['prod'],()=>{
  const a=D.prod.filter(o=>ACT.includes(o.estado)).map(o=>({o,d:diasDe(entrega(o))}));
  const bk=[['Vencidos >15 d',x=>x.d!=null&&x.d<-15,'#991b1b'],['Vencidos 8–15 d',x=>x.d!=null&&x.d>=-15&&x.d<-7,'var(--danger)'],['Vencidos 1–7 d',x=>x.d!=null&&x.d>=-7&&x.d<0,'#f97316'],['Hoy',x=>x.d===0,'var(--warn)'],['1–5 días',x=>x.d>=1&&x.d<=5,'#eab308'],['6–15 días',x=>x.d>=6&&x.d<=15,'var(--ok)'],['Más de 15 días',x=>x.d>15,'#15803d'],['Sin fecha',x=>x.d==null,'#94a3b8']];
  const venc=a.filter(x=>x.d!=null&&x.d<0).sort((p,q)=>p.d-q.d).map(x=>[x.o.op,x.o.item_num,x.o.empresa,x.o.descripcion,x.o.estado,+x.o.avance||0,x.d]);
  return kpis([['Ítems en curso',num(a.length)],['Vencidos',num(venc.length),fP(pct(venc.length,a.length)),'red'],['Vencen en ≤ 5 días',num(a.filter(x=>x.d!=null&&x.d>=0&&x.d<=5).length),'','amb'],['Avance promedio',fP(avg(a.map(x=>+x.o.avance||0)))]])
   +card('Cartera por días a la entrega',bars(bk.map(b=>[b[0],a.filter(b[1]).length,b[2]])))
   +card('Ítems vencidos',tbl('Ítems vencidos',[C('OP'),C('Ítem'),C('Cliente'),cT('Descripción',50),C('Estado'),cN('% avance'),cDias('Entrega')],venc,{limit:30}));},{fecha:false});
R('l2','planeacion','Carga pendiente por máquina','Horas planeadas que faltan por producir (horas × (1 − avance)) en los ítems en curso.',['prod'],()=>{
  const a=D.prod.filter(o=>ACT.includes(o.estado));
  const r=MAQS.map(([k,n])=>{const u=a.filter(o=>+o['hrs_'+k]>0);const tot=sum(u,o=>o['hrs_'+k]);const pen=sum(u,o=>(+o['hrs_'+k])*(1-Math.min(100,+o['avance_'+k]||0)/100));return [n,u.length,tot,pen,pct(tot-pen,tot)];}).filter(x=>x[1]>0).sort((x,y)=>y[3]-x[3]);
  return kpis([['Horas pendientes',fH(sum(r,x=>x[3])),'todas las máquinas'],['Horas planeadas',fH(sum(r,x=>x[2]))]])
   +card('Horas pendientes por máquina',bars(r.map(x=>[x[0],x[3],'var(--accent)']),v=>num(v,0)+' h'))
   +card('Detalle',tbl('Carga por máquina',[C('Máquina'),cN('Ítems'),cH('Horas planeadas'),cH('Horas pendientes'),cP('% avanzado')],r,{sort:[3,-1]}))
   +'<div class="note">Soldadura, EDM e Hilo dependen de que el ítem tenga horas planeadas cargadas.</div>';},{fecha:false});
R('l3','planeacion','Entregas por semana','Ítems en curso agrupados por la semana de su fecha de entrega (atrasados aparte).',['prod'],()=>{
  const a=D.prod.filter(o=>ACT.includes(o.estado)).map(o=>({o,d:diasDe(entrega(o))}));
  const wk=d=>d==null?'Sin fecha':d<0?'Atrasados':d>=56?'Más de 8 semanas':'Semana +'+Math.floor(d/7);
  const ord=['Atrasados'].concat(Array.from({length:8},(_,i)=>'Semana +'+i),['Más de 8 semanas','Sin fecha']);
  const g=group(a,x=>wk(x.d));
  const r=ord.filter(k=>g.has(k)).map(k=>{const u=g.get(k);return [k,u.length,sum(u,x=>MAQS.reduce((s,m)=>s+(+x.o['hrs_'+m[0]]||0)*(1-Math.min(100,+x.o['avance_'+m[0]]||0)/100),0))];});
  return card('Ítems por semana de entrega',bars(r.map(x=>[x[0],x[1],x[0]==='Atrasados'?'var(--danger)':'var(--accent)'])))+card('Detalle',tbl('Entregas por semana',[C('Semana'),cN('Ítems'),cH('Horas pendientes')],r,{}))+'<div class="note">«Semana +0» = próximos 7 días.</div>';},{fecha:false});
R('l4','planeacion','Materiales que frenan la producción','Materiales solicitados o comprados que aún no se reciben, de ítems en curso.',['mat','prod'],()=>{
  const pm=new Map(D.prod.map(o=>[o.id,o]));
  const r=D.mat.filter(m=>['SOLICITADO','COMPRADO'].includes(m.estado)).map(m=>({m,o:pm.get(m.id_prod)})).filter(x=>x.o&&ACT.includes(x.o.estado)).map(x=>[x.o.op,x.o.item_num,x.o.empresa,x.m.material,x.m.proveedor,x.m.estado,-diasDe(x.m.solicitado_at),diasDe(entrega(x.o))]);
  return kpis([['Materiales sin recibir',num(r.length),'de ítems en curso','amb'],['Solicitados hace >7 días',num(r.filter(x=>x[6]>7).length),'','red'],['Con entrega ya vencida',num(r.filter(x=>x[7]!=null&&x[7]<0).length),'','red']])
   +card('Detalle',tbl('Materiales pendientes',[C('OP'),C('Ítem'),C('Cliente'),cT('Material',45),C('Proveedor'),C('Estado'),{h:'Días solicitado',f:v=>num(v),r:true},cDias('Entrega ítem')],r,{sort:[6,-1]}));},{fecha:false});
/* ── navegación ── */
let CUR='',AREA='';
function go(id){if(id&&REP[id]&&!puede(...AREAS.find(x=>x.k===REP[id].area).roles))id='';CUR=id&&REP[id]?id:'';const a=CUR?REP[CUR].area:(AREA||'');if(CUR)AREA=a;renderNav();if(CUR)run(CUR);else home();}
function renderNav(){const ar=areasOk();
  document.getElementById('areas').innerHTML=ar.map(a=>`<button class="ab ${AREA===a.k?'on':''}" onclick="pickArea('${a.k}')">${a.n}</button>`).join('');
  const rs=Object.values(REP).filter(r=>r.area===AREA);
  document.getElementById('reps').style.display=AREA?'flex':'none';
  document.getElementById('reps').innerHTML=rs.map(r=>`<button class="rb ${CUR===r.id?'on':''}" onclick="location.hash='${r.id}'">${esc(r.t)}</button>`).join('');
  renderFil();document.getElementById('fil').style.display=CUR?'flex':'none';}
function pickArea(k){AREA=k;const f=Object.values(REP).find(r=>r.area===k);location.hash=f.id;}
function home(){AREA='';renderNav();document.getElementById('reps').style.display='none';
  document.getElementById('main').innerHTML=`<div class="rh"><h2>Centro de reportes</h2><p>Elige un área y un reporte. Todo es de solo lectura: ningún reporte modifica datos. Los valores en pesos son antes de IVA.</p></div><div class="home">`+areasOk().map(a=>`<div class="hc"><h3>${a.n}</h3>`+Object.values(REP).filter(r=>r.area===a.k).map(r=>`<a href="#${r.id}">${esc(r.t)}<small>${esc(r.d)}</small></a>`).join('')+`</div>`).join('')+`</div>`;}
let _run=0;
async function run(id){const r=REP[id];if(!r)return;const my=++_run;const m=document.getElementById('main');
  m.innerHTML=`<div class="empty">⏳ Cargando datos…</div>`;
  try{await need(...r.need);if(my!==_run)return;EXP=[];TB={};const body=r.fn();
    m.innerHTML=`<div class="rh"><h2>${esc(r.t)}</h2><div class="act"><button onclick="exportar()">⬇ Excel (CSV)</button><button onclick="window.print()">🖨 Imprimir / PDF</button><button onclick="refrescar()">↻ Actualizar</button></div><p>${esc(r.d)}</p></div><div id="pt">Grupo WEDM · ${esc(r.t)} · ${r.fecha===false?'situación al '+fD(todayS()):fD(F.desde)+' a '+fD(F.hasta)} · generado por ${esc(S&&S.nombre)}</div>`+body;
  }catch(e){if(my===_run)m.innerHTML=`<div class="empty">⚠️ ${esc(e.message||e)}<br><button class="more" onclick="run('${id}')">Reintentar</button></div>`;}}
function exportar(){if(!EXP.length){toast('No hay tablas para exportar');return;}
  const q=v=>{v=v==null?'':String(v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  let out=[`Reporte;${q(REP[CUR].t)}`,`Rango;${F.desde} a ${F.hasta}`,''];
  EXP.forEach(t=>{out.push(q(t.title));out.push(t.cols.map(c=>q(c.h)).join(';'));t.rows.forEach(r=>out.push(r.map((v,i)=>q(typeof v==='number'?String(Math.round(v*100)/100).replace('.',','):v)).join(';')));out.push('');});
  const b=new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='reporte_'+CUR+'_'+todayS()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
window.addEventListener('hashchange',()=>{if(S)go(location.hash.slice(1));});
/* ── login ── */
let USERS=[],LU=null,PIN='',busy=false;
async function cargarUsers(){try{const r=await sb.rpc('listar_usuarios');if(Array.isArray(r))USERS=r;}catch(e){}
  const ok=USERS.filter(u=>permitido(u.nombre,u.rol,u.roles_extra)).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  document.getElementById('ug').innerHTML=ok.length?ok.map(u=>`<button class="ub" data-u="${esc(u.nombre)}" onclick="pickUser(this.dataset.u)">${esc(u.nombre)}<small>${esc(u.rol)}</small></button>`).join(''):`<div class="empty">No se pudo cargar la lista.<br><button class="more" onclick="cargarUsers()">Reintentar</button></div>`;}
function devOpen(){document.getElementById('ls-user').style.display='none';document.getElementById('ls-dev').style.display='block';document.getElementById('dverr').textContent='';}
function devBack(){document.getElementById('ls-dev').style.display='none';document.getElementById('ls-user').style.display='block';}
async function doLoginDev(){if(busy)return;const u=document.getElementById('dvu').value.trim(),p=document.getElementById('dvp').value,er=document.getElementById('dverr');if(!u||!p){er.textContent='Escribe usuario y clave';return;}
  busy=true;er.textContent='Verificando…';
  try{const r=await sb.rpc('login_usuario',{p_nombre:u,p_pin:p});
    if(!r||!r.ok){er.textContent=(r&&r.msg)||'Usuario o clave incorrectos';return;}
    if(!permitido(r.nombre,r.rol,r.roles)){er.textContent='Reportes es de uso exclusivo de Diego Muñoz';sb.tok=r.token;try{await sb.rpc('logout_usuario');}catch(e){}sb.tok=null;return;}
    S={nombre:r.nombre,asesor:r.asesor||'',rol:r.rol,roles:(r.roles&&r.roles.length?r.roles:[r.rol]),token:r.token,ts:Date.now()};sb.tok=r.token;
    try{localStorage.setItem(SESS_KEY,JSON.stringify(S));}catch(e){}arrancar();
  }catch(e){er.textContent='Sin conexión — intenta de nuevo';}finally{busy=false;}}
function pickUser(n){LU=n;PIN='';const u=USERS.find(x=>x.nombre===n)||{};document.getElementById('ls-user').style.display='none';document.getElementById('ls-pin').style.display='block';document.getElementById('lname').textContent=n;document.getElementById('lrol').textContent=u.rol||'';document.getElementById('lerr').textContent='';dots();}
function pinBack(){LU=null;PIN='';document.getElementById('ls-pin').style.display='none';document.getElementById('ls-dev').style.display='none';document.getElementById('ls-user').style.display='block';}
function dots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.className=i<PIN.length?'f':'');}
function pinP(d){if(busy||PIN.length>=4)return;PIN+=d;dots();if(PIN.length===4)setTimeout(doLogin,100);}
function pinDel(){if(busy)return;PIN=PIN.slice(0,-1);dots();}
document.addEventListener('keydown',e=>{if(document.getElementById('ls-pin').style.display!=='block')return;if(/^\d$/.test(e.key))pinP(e.key);else if(e.key==='Backspace')pinDel();});
async function doLogin(){if(!LU||busy)return;busy=true;const err=document.getElementById('lerr');
  try{const r=await sb.rpc('login_usuario',{p_nombre:LU,p_pin:PIN});
    if(!r||!r.ok){err.textContent=(r&&r.msg)||'Clave incorrecta';PIN='';dots();return;}
    if(!permitido(r.nombre,r.rol,r.roles)){err.textContent='Reportes es de uso exclusivo de Diego Muñoz';PIN='';dots();try{sb.tok=r.token;await sb.rpc('logout_usuario');}catch(e){}sb.tok=null;return;}
    S={nombre:r.nombre,asesor:r.asesor||'',rol:r.rol,roles:(r.roles&&r.roles.length?r.roles:[r.rol]),token:r.token,ts:Date.now()};sb.tok=r.token;
    try{localStorage.setItem(SESS_KEY,JSON.stringify(S));}catch(e){}
    
    arrancar();
  }catch(e){err.textContent='Sin conexión — intenta de nuevo';PIN='';dots();}finally{busy=false;}}
async function logout(){try{await sb.rpc('logout_usuario');}catch(e){}forceLogout();}
function forceLogout(msg){S=null;sb.tok=null;try{localStorage.removeItem(SESS_KEY);}catch(e){}Object.keys(D).forEach(k=>delete D[k]);CUR='';AREA='';
  document.getElementById('main').innerHTML='';document.getElementById('areas').innerHTML='';document.getElementById('reps').style.display='none';document.getElementById('fil').style.display='none';
  document.getElementById('login').style.display='flex';pinBack();cargarUsers();if(msg)toast(msg);}
function arrancar(){document.getElementById('login').style.display='none';if(!areasOk().length){forceLogout('Tu rol no tiene reportes asignados');return;}
  const h=location.hash.slice(1);if(h&&REP[h]&&puede(...AREAS.find(a=>a.k===REP[h].area).roles))go(h);else{location.hash='';go('');}}
(async function init(){
  if(S&&S.token){let v=true;try{v=await sb.rpc('sesion_valida');}catch(e){}
    if(v!==false&&permitido(S.nombre,S.rol,S.roles)){arrancar();return;}
    S=null;sb.tok=null;try{localStorage.removeItem(SESS_KEY);}catch(e){}}
  document.getElementById('login').style.display='flex';cargarUsers();})();
</script>
